site_name: CMW2026 사용자 매뉴얼
site_description: Coupling Matrix Wizard 2026 Ver 2.0
site_author: Partron RF Solution Team

# ★ 추가: 오프라인에서도 링크가 깨지지 않게 합니다.
use_directory_urls: false

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: blue
      accent: light blue
    - scheme: slate
      primary: blue
      accent: light blue
  features:
    - navigation.sidebar
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    # - search.share          # ★ 오프라인 오류 방지를 위해 주석 처리
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: ko
      separator: '[\s\-\.]+'
  - offline                # ★ 추가: 오프라인 플러그인 (반드시 맨 아래)

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - 홈: index.md
  - "Ch 1. 개요": ch01.md
  - "Ch 2. 설치 및 라이선스": ch02.md
  - "Ch 3. 화면 구성": ch03.md
  - "Ch 4. Synthesize 모드": ch04.md
  - "Ch 5. Filter(CBW) 모드": ch05.md
  - "Ch 6. 마커 설정": ch06.md
  - "Ch 7. Temp Simulation": ch07.md
  - "Ch 8. 메뉴 및 파일 입출력": ch08.md
  - "Ch 9. 용어 정리": ch09.md
  - "Ch 10. Design Guide": ch10.md
  - "부록 (FAQ)": appendix.md